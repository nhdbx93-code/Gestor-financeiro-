<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia 💈 | Gestão Financeira</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070214;
            --surface: rgba(26, 17, 54, 0.7);
            --primary: #8b5cf6;
            --mercado-pago: #009ee3;
            --success: #10b981;
            --danger: #f43f5e;
            --text: #ffffff;
            --radius-lg: 35px;
            --radius-md: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.1) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- NOVO HEADER: NOME DO APP --- */
        .app-header {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        .app-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* --- HEADER: SALDO --- */
        .main-balance {
            background: linear-gradient(145deg, #7c3aed, #4c1d95);
            padding: 40px 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .main-balance p { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; margin-bottom: 5px; }
        .main-balance h1 { font-size: 3rem; font-weight: 800; letter-spacing: -2px; }

        .support-btn {
            background: var(--mercado-pago);
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: var(--radius-lg);
            font-weight: 800;
            font-size: 0.95rem;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 158, 227, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .support-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        .row-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        .stat-card span { font-size: 0.7rem; color: #a78bfa; display: block; margin-bottom: 5px; font-weight: 600; }
        .stat-card strong { font-size: 1.1rem; font-weight: 800; }
        .inc { color: var(--success); }
        .exp { color: var(--danger); }

        .card-form {
            background: var(--surface);
            padding: 25px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .input-group { margin-bottom: 12px; }
        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .btn-add {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:hover { transform: scale(1.02); }

        .history-section h3 { font-size: 1rem; margin: 10px 0 15px 15px; color: #a78bfa; font-weight: 700; }
        .list { display: flex; flex-direction: column; gap: 10px; }
        
        .item {
            background: var(--surface);
            padding: 18px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: 0.2s;
        }

        .item:hover { border-color: var(--danger); background: rgba(244, 63, 94, 0.1); }
        .item-info h4 { font-size: 0.95rem; }
        .item-info small { font-size: 0.7rem; color: #94a3b8; }

        @media (min-width: 800px) {
            .container { max-width: 850px; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
            .app-header, .main-balance, .support-btn, .row-stats { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="app-header">
            <h2>Barbearia 💈</h2>
        </header>

        <div class="main-balance">
            <p>Saldo Geral</p>
            <h1 id="balance">R$ 0,00</h1>
        </div>

        <a href="https://mpago.la/1o9CiVo" target="_blank" class="support-btn">
            ❤️ Apoiar nosso projeto
        </a>

        <div class="row-stats">
            <div class="stat-card">
                <span>Entradas</span>
                <strong class="inc" id="inc-val">R$ 0,00</strong>
            </div>
            <div class="stat-card">
                <span>Saídas</span>
                <strong class="exp" id="exp-val">R$ 0,00</strong>
            </div>
        </div>

        <section class="card-form">
            <form id="form">
                <div class="input-group">
                    <input type="text" id="text" placeholder="Descrição (ex: Corte de Cabelo)" required>
                </div>
                <div class="input-group">
                    <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required>
                </div>
                <div class="input-group">
                    <select id="type">
                        <option value="plus">Entrada (+)</option>
                        <option value="minus">Saída (-)</option>
                    </select>
                </div>
                <button class="btn-add">Registrar no Fluxo</button>
            </form>
        </section>

        <section class="history-section">
            <h3>Atividades Recentes</h3>
            <div id="list" class="list"></div>
        </section>
    </div>

    <script>
        const balanceDisplay = document.getElementById('balance');
        const incDisplay = document.getElementById('inc-val');
        const expDisplay = document.getElementById('exp-val');
        const list = document.getElementById('list');
        const form = document.getElementById('form');

        // Mantive a chave 'finance_flow_macena' para não perder seus dados salvos
        let transactions = JSON.parse(localStorage.getItem('finance_flow_macena')) || [];

        function formatBRL(v) {
            return v.toLocaleString('pt-br', { style: 'currency', currency: 'BRL' });
        }

        function removeTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            update();
        }

        function update() {
            list.innerHTML = "";
            transactions.forEach(t => {
                const isPlus = t.type === 'plus';
                const div = document.createElement('div');
                div.className = `item`;
                div.onclick = () => removeTransaction(t.id);
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${t.text}</h4>
                        <small>${t.date}</small>
                    </div>
                    <strong class="${isPlus ? 'inc' : 'exp'}">
                        ${isPlus ? '+' : '-'} ${formatBRL(t.amount)}
                    </strong>
                `;
                list.prepend(div);
            });

            const amounts = transactions.map(t => t.type === 'plus' ? t.amount : -t.amount);
            const total = amounts.reduce((acc, v) => acc + v, 0);
            const inc = amounts.filter(v => v > 0).reduce((acc, v) => acc + v, 0);
            const exp = Math.abs(amounts.filter(v => v < 0).reduce((acc, v) => acc + v, 0));

            balanceDisplay.innerText = formatBRL(total);
            incDisplay.innerText = formatBRL(inc);
            expDisplay.innerText = formatBRL(exp);

            localStorage.setItem('finance_flow_macena', JSON.stringify(transactions));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const transaction = {
                id: Date.now(),
                text: document.getElementById('text').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                date: new Date().toLocaleDateString('pt-br')
            };
            transactions.push(transaction);
            form.reset();
            update();
        });

        update();
    </script>
</body>
</html>
